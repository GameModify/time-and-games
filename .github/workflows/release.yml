name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import fs from 'node:fs'; if ('v' + JSON.parse(fs.readFileSync('package.json','utf8')).version !== process.env.RELEASE_TAG) throw new Error('Tag and package versions differ')"
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npm run package:release
      - run: npm run smoke:release
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          gh release create $env:RELEASE_TAG "dist/releases/TimeAndGames-$version.zip" "dist/releases/SHA256SUMS.txt" --verify-tag --title "Time & Games $version" --notes-file "docs/releases/$version.md"
