name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, lint and tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Quality configuration
        run: npm run quality:audit
      - name: Static checks
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Regression tests
        run: npm test
      - name: Package release
        if: runner.os == 'Windows'
        run: npm run package:release
      - name: Verify release startup
        if: runner.os == 'Windows'
        run: npm run smoke:release
